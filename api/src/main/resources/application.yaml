spring:
  profiles:
    active: ${SPRING_PROFILE:local}
  application:
    name: StreamlynApi

  data:
    mongodb:
      uri: mongodb://${DB_USERNAME:admin}:${DB_PASSWORD:admin}@${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:streamlyn}?replicaSet=${DB_REPLICA_SET:rs0}&authSource=${DB_AUTH_DB:admin}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  cloud:
    config:
      enabled: false
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      s3:
        bucket: ${OBJECT_STORAGE_BUCKET:streamlyn}

app:
  url: ${APP_URL:http://localhost:8080}

tus:
  max-size: ${TUS_MAX_SIZE:10737418240}

object-storage:
  tmp-dir: ${OBJECT_STORAGE_TMP_DIR:/tmp}
  output-dir: ${OBJECT_STORAGE_OUTPUT_DIR:/uploads}
  bucket: ${OBJECT_STORAGE_BUCKET:streamlyn}