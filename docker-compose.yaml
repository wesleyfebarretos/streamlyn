version: '3.9'

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local

networks:
  streamlyn:
    driver: bridge

services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: streamlyn
    volumes:
      - mongo_data:/data/db
      - $PWD/.docker/mongo/security-key:/data/security-key
    networks:
      - streamlyn
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /data/security-key
        chown 999:999 /data/security-key
        exec docker-entrypoint.sh $$@
    command: "mongod --bind_ip_all --replSet rs0 --keyFile /data/security-key"

  mongo-setup:
    image: mongo:8.0
    container_name: mongo-setup
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    networks:
      - streamlyn
    depends_on:
      - mongo
    volumes:
      - $PWD/.docker/mongo/init.sh:/scripts/init.sh
    restart: on-failure
    entrypoint: [ "/bin/bash", "/scripts/init.sh" ]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    networks:
      - streamlyn
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: streamlyn
      MINIO_ROOT_PASSWORD: streamlyn
      MINIO_BUCKETS: "streamlyn"
    command: server /data --console-address ":9001"

  minio_setup:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    depends_on:
      - minio
    restart: on-failure
    networks:
      - streamlyn
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 streamlyn streamlyn;
      /usr/bin/mc mb dockerminio/streamlyn;
      exit 0;
      "
